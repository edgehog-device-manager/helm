name: Lint Chart

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.3

      - name: Set up Python (for yamllint)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: helm lint
        run: helm lint charts/edgehog --strict --values tests/values.yaml

      - name: yamllint
        run: |
          pip install yamllint
          yamllint -c .yamllint .

      - name: Update chart dependencies
        run: helm dependency update charts/edgehog

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Render templates and validate against Kubernetes schemas
        run: |
          helm template charts/edgehog --values tests/values.yaml \
            | kubeconform -strict -summary -kubernetes-version "1.30.0"
