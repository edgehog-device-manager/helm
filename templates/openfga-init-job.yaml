{{- if and .Values.openfga.enabled .Values.openfgaInitJob.enabled (eq .Values.authorization.provider "openfga") (not .Values.authorization.existingStoreSecret) (not .Values.authorization.storeId) }}
{{- $fullname := include "edgehog.fullname" . -}}
{{- $secretName := include "edgehog.openfgaStoreSecretName" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-openfga-init
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-openfga-init
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-openfga-init
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-openfga-init
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-openfga-init
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-openfga-init
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.openfgaInitJob.backoffLimit }}
  {{- if .Values.openfgaInitJob.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.openfgaInitJob.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.openfgaInitJob.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "edgehog.componentLabels" (dict "root" . "component" "openfga-init") | nindent 8 }}
        {{- with .Values.openfgaInitJob.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $fullname }}-openfga-init
      restartPolicy: Never
      {{- with .Values.openfgaInitJob.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openfga-init
          image: {{ include "edgehog.image" (dict "root" . "image" .Values.openfgaInitJob.image "defaultTag" "latest") }}
          imagePullPolicy: {{ .Values.openfgaInitJob.image.pullPolicy }}
          env:
            - name: FGA_CLI_VERSION
              value: {{ .Values.openfgaInitJob.fgaCliVersion | quote }}
            - name: FGA_CLI_PLATFORM
              value: {{ .Values.openfgaInitJob.cliPlatform | quote }}
            - name: OPENFGA_HTTP_URL
              value: {{ printf "http://%s-openfga:8080" .Release.Name | quote }}
            - name: SECRET_NAME
              value: {{ $secretName | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache jq tar curl >/dev/null
              wget -qO /tmp/fga.tar.gz "https://github.com/openfga/cli/releases/download/v${FGA_CLI_VERSION}/fga_${FGA_CLI_VERSION}_${FGA_CLI_PLATFORM}.tar.gz"
              tar -xzf /tmp/fga.tar.gz -C /tmp
              # Reconstruct the modular model directory layout from the flattened ConfigMap.
              mkdir -p /model
              {{- range $path, $_ := .Files.Glob "files/fga/**" }}
              {{- $rel := trimPrefix "files/fga/" $path }}
              mkdir -p "/model/{{ dir $rel }}"
              cp "/src/{{ replace "/" "-" $rel }}" "/model/{{ $rel }}"
              {{- end }}
              /tmp/fga store create --model /model/fga.mod --format modular --api-url "${OPENFGA_HTTP_URL}" > /tmp/store.json
              STORE_ID="$(jq -r '.store.id' /tmp/store.json)"
              MODEL_ID="$(jq -r '.model.authorization_model_id' /tmp/store.json)"
              echo "Created OpenFGA store ${STORE_ID} with model ${MODEL_ID}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS}"
              BODY="$(jq -n --arg ns "${POD_NAMESPACE}" --arg name "${SECRET_NAME}" \
                --arg sid "${STORE_ID}" --arg mid "${MODEL_ID}" \
                '{apiVersion:"v1",kind:"Secret",metadata:{name:$name,namespace:$ns},stringData:{"store-id":$sid,"auth-model-id":$mid}}')"
              CODE="$(curl -sk -o /dev/null -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' \
                -d "${BODY}" "${API}/api/v1/namespaces/${POD_NAMESPACE}/secrets")"
              if [ "${CODE}" = "409" ]; then
                curl -sk -X PATCH \
                  -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/merge-patch+json' \
                  -d "{\"stringData\":{\"store-id\":\"${STORE_ID}\",\"auth-model-id\":\"${MODEL_ID}\"}}" \
                  "${API}/api/v1/namespaces/${POD_NAMESPACE}/secrets/${SECRET_NAME}"
              elif [ "${CODE}" != "201" ]; then
                echo "Failed to write secret ${SECRET_NAME} (HTTP ${CODE})" >&2
                exit 1
              fi
          volumeMounts:
            - name: fga-model
              mountPath: /src
          {{- with .Values.openfgaInitJob.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: fga-model
          configMap:
            name: {{ $fullname }}-fga-model
{{- end }}
