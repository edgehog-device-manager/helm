{{/* Core secret: Phoenix secret key bases for backend and device forwarder. */}}
{{- $forwarderEnabled := .Values.forwarder.enabled -}}
{{- $renderBackend := not .Values.backend.existingSecret -}}
{{- $renderForwarder := and $forwarderEnabled (not .Values.forwarderConfig.existingSecret) -}}
{{- $forwarderStoredKey := printf "forwarder-%s" .Values.forwarderConfig.existingSecretKey -}}
{{- if or $renderBackend $renderForwarder }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edgehog.fullname" . }}
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $renderBackend }}
  {{ .Values.backend.existingSecretKey }}: {{ include "edgehog.secretKeyBase" (dict "root" . "value" .Values.backend.secretKeyBase "existingSecret" "" "existingKey" .Values.backend.existingSecretKey "secretName" (include "edgehog.fullname" .)) | quote }}
  {{- end }}
  {{- if $renderForwarder }}
  {{ $forwarderStoredKey }}: {{ include "edgehog.secretKeyBase" (dict "root" . "value" .Values.forwarderConfig.secretKeyBase "existingSecret" "" "existingKey" $forwarderStoredKey "secretName" (include "edgehog.fullname" .)) | quote }}
  {{- end }}
{{- end }}
---
{{/* Database credentials, rendered only when a plaintext password is given. */}}
{{- if and .Values.database.password (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edgehog.fullname" . }}-db
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.database.username | quote }}
  password: {{ .Values.database.password | quote }}
  database: {{ .Values.database.database | quote }}
{{- end }}
---
{{/* S3 credentials. */}}
{{- if eq .Values.storage.type "s3" }}
{{- $s3 := .Values.storage.s3 -}}
{{- if and (not $s3.existingSecret) (or $s3.accessKeyId $s3.secretAccessKey $s3.gcpCredentialsJson) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edgehog.fullname" . }}-s3
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $s3.gcpCredentialsJson }}
  gcp-credentials: {{ $s3.gcpCredentialsJson | quote }}
  {{- else }}
  access-key-id: {{ required "storage.s3.accessKeyId is required" $s3.accessKeyId | quote }}
  secret-access-key: {{ required "storage.s3.secretAccessKey is required" $s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
---
{{/* Azure Blob credentials. */}}
{{- if eq .Values.storage.type "azure" }}
{{- $az := .Values.storage.azure -}}
{{- if not $az.existingSecret }}
{{- if or $az.connectionString (and $az.accountName $az.accountKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edgehog.fullname" . }}-azure
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $az.connectionString }}
  connection-string: {{ $az.connectionString | quote }}
  {{- else }}
  account-name: {{ required "storage.azure.accountName is required" $az.accountName | quote }}
  account-key: {{ required "storage.azure.accountKey is required" $az.accountKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
---
{{/* Geolocation provider API keys. */}}
{{- $geo := .Values.geolocation -}}
{{- if and (not $geo.existingSecret) (or $geo.ipbaseApiKey $geo.googleGeolocationApiKey $geo.googleGeocodingApiKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edgehog.fullname" . }}-geo
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $geo.ipbaseApiKey }}
  ipbase-api-key: {{ $geo.ipbaseApiKey | quote }}
  {{- end }}
  {{- if $geo.googleGeolocationApiKey }}
  google-geolocation-api-key: {{ $geo.googleGeolocationApiKey | quote }}
  {{- end }}
  {{- if $geo.googleGeocodingApiKey }}
  google-geocoding-api-key: {{ $geo.googleGeocodingApiKey | quote }}
  {{- end }}
{{- end }}
---
{{/* Database TLS CA certificate. */}}
{{- if and .Values.database.tls.enabled .Values.database.tls.cacertPem }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edgehog.fullname" . }}-db-ca
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
type: Opaque
data:
  ca.crt: {{ required "database.tls.cacertPem must be a valid PEM certificate" .Values.database.tls.cacertPem | b64enc }}
{{- end }}
---
{{/* Admin API public key. */}}
{{- if and .Values.backend.adminApi.publicKeyPem (not .Values.backend.adminApi.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "edgehog.fullname" . }}-admin-key
  labels:
    {{- include "edgehog.labels" . | nindent 4 }}
type: Opaque
data:
  admin_public.pem: {{ required "backend.adminApi.publicKeyPem must be a valid PEM public key" .Values.backend.adminApi.publicKeyPem | b64enc }}
{{- end }}
