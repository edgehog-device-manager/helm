{{- $scheme := include "edgehog.urlScheme" . -}}
{{- $portSuffix := include "edgehog.urlPortSuffix" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgehog.fullname" . }}-frontend
  labels:
    {{- include "edgehog.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontendConfig.replicaCount }}
  selector:
    matchLabels:
      {{- include "edgehog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      {{- with .Values.frontendConfig.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "edgehog.componentLabels" (dict "root" . "component" "frontend") | nindent 8 }}
        {{- with .Values.frontendConfig.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "edgehog.serviceAccountName" . }}
      {{- with .Values.frontendConfig.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: edgehog-frontend
          image: {{ include "edgehog.image" (dict "root" . "image" .Values.frontendConfig.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.frontendConfig.image.pullPolicy }}
          {{- with .Values.frontendConfig.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: BACKEND_URL
              value: {{ printf "%s://%s%s/" $scheme (required "backend.host is required" .Values.backend.host) $portSuffix | quote }}
            {{- if .Values.frontendConfig.hideNavigationElements }}
            - name: HIDE_NAVIGATION_ELEMENTS
              value: {{ .Values.frontendConfig.hideNavigationElements | quote }}
            {{- end }}
            {{- with .Values.frontendConfig.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.frontendConfig.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.frontendConfig.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.frontendConfig.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.frontendConfig.resources | nindent 12 }}
      {{- with .Values.frontendConfig.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontendConfig.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.frontendConfig.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edgehog.fullname" . }}-frontend
  labels:
    {{- include "edgehog.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "edgehog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
