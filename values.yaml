# Default values for the Edgehog Helm chart.
#
# Prerequisites (managed outside of this chart):
#   - an external PostgreSQL database
#   - an external Astarte instance with an existing realm and its private key
#   - an S3-compatible storage (or Azure Blob) for OTA updates and files
#   - routing and TLS certificates for the hosts below (e.g. an Ingress)
#
# Tenants are provisioned after the installation through the Admin API (see
# NOTES.txt and README.md).

global:
  ## Global Docker image registry.
  imageRegistry: ""
  ## Global image pull secrets.
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

## ---------------------------------------------------------------------------
## Hosts
##
## Three DNS names must point at the routing of the cluster:
##   - frontend.host: the Edgehog dashboard
##   - backend.host:  the Edgehog GraphQL/REST API
##   - forwarder.host: the Device Forwarder (WebSocket sessions with devices)
## ---------------------------------------------------------------------------
frontend:
  enabled: true
  host: ""

  image:
    registry: ""
    repository: edgehogdevicemanager/edgehog-frontend
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  replicaCount: 1

  ## Hides tenant management UI elements (useful when embedding the dashboard).
  hideNavigationElements: ""

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}

  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

  extraEnv: []
  extraEnvFrom: []

backend:
  host: ""

  image:
    registry: ""
    repository: edgehogdevicemanager/edgehog-backend
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  replicaCount: 1

  ## Phoenix SecretKeyBase. If left empty, a random one is generated on the
  ## first install and persisted in the <fullname> secret across upgrades.
  secretKeyBase: ""
  existingSecret: "" # alternative: name of an existing secret with key "secret-key-base"
  existingSecretKey: "secret-key-base"

  ## Public PEM key used to validate Admin API JWTs (the private half stays
  ## with whoever provisions tenants). Generate with:
  ##   openssl ecparam -name prime256v1 -genkey -noout > admin_private.pem
  ##   openssl ec -in admin_private.pem -pubout > admin_public.pem
  adminApi:
    publicKeyPem: ""
    existingSecret: ""
    existingSecretKey: "admin_public.pem"

  ## Comma-separated list of origins allowed for GraphQL subscriptions.
  ## Defaults to the frontend origin derived from frontend.host/url.*.
  gqlSubscriptionsAllowedOrigins: ""

  ## Connection settings for the external PostgreSQL database required by the
  ## backend. The password is only referenced by secret, never set in values.
  database:
    hostname: "" # required
    username: edgehog
    database: edgehog
    poolSize: 10
    passwordExistingSecret: "" # required
    passwordExistingSecretKey: "password"

  ## Storage for OTA updates and uploaded files (S3-compatible or Azure Blob).
  storage:
    type: s3 # s3 | azure
    maxUploadSizeBytes: "5000000000"

    s3:
      scheme: https
      host: "" # e.g. s3.amazonaws.com or storage.googleapis.com (enables the GCS adapter)
      port: ""
      bucket: ""
      region: ""
      ## Public/presigning host for asset URLs, e.g. "storage.googleapis.com/<bucket>"
      ## or "<bucket>.s3.amazonaws.com".
      assetHost: ""
      accessKeyId: ""
      secretAccessKey: ""
      existingSecret: ""
      existingSecretAccessKeyIdKey: "access-key-id"
      existingSecretSecretAccessKeyKey: "secret-access-key"
      ## Google Cloud Storage service account credentials JSON, referenced from
      ## an existing secret (used instead of access keys when the host is
      ## storage.googleapis.com).
      gcpCredentialsExistingSecret: ""
      gcpCredentialsExistingSecretKey: "credentials.json"

    azure:
      container: ""
      connectionString: ""
      accountName: ""
      accountKey: ""
      blobEndpoint: ""
      region: ""
      existingSecret: ""
      existingSecretConnectionStringKey: "connection-string"
      existingSecretAccountNameKey: "account-name"
      existingSecretAccountKeyKey: "account-key"

  ## Geolocation providers (all optional).
  geolocation:
    ipbaseApiKey: ""
    googleGeolocationApiKey: ""
    googleGeocodingApiKey: ""
    preferredGeolocationProviders: ""
    preferredGeocodingProviders: ""
    ## Alternative to the values above; expected keys:
    ## ipbase-api-key, google-geolocation-api-key, google-geocoding-api-key
    existingSecret: ""

  ## Backend tuning knobs (empty = backend default).
  tenantReconcilerTimeoutMs: ""
  messageMinTimeoutMs: ""
  messageMaxTimeoutMs: ""
  provisioningMaxRetries: ""
  deploymentProvisioningTimeoutMs: ""

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}

  podSecurityContext: {}
  securityContext: {}

  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

  extraEnv: []
  extraEnvFrom: []

forwarder:
  enabled: true
  host: ""

  image:
    registry: ""
    repository: edgehogdevicemanager/edgehog-device-forwarder
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  replicaCount: 1

  ## SecretKeyBase for the forwarder release. Generated and persisted like the
  ## backend one when left empty.
  secretKeyBase: ""
  existingSecret: ""
  existingSecretKey: "secret-key-base"

  containerPort: 4000

  ## Port devices use to reach the forwarder. Defaults to 443 or 80 depending
  ## on url.scheme.
  externalPort: ""

  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}

  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12

  extraEnv: []
  extraEnvFrom: []

## Scheme and port used by browsers/devices to reach the backend and frontend.
## The port is only advertised when set (standard 443/80 is assumed otherwise).
url:
  scheme: https
  port: ""
