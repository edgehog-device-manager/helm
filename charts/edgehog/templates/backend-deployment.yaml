{{- $scheme := include "edgehog.urlScheme" . -}}
{{- $portSuffix := include "edgehog.urlPortSuffix" . -}}
{{- $fullname := include "edgehog.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- include "edgehog.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "edgehog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "edgehog.componentLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: edgehog-backend
          image: {{ include "edgehog.image" (dict "root" . "image" .Values.backend.image "defaultTag" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: RELEASE_NAME
              value: edgehog
            - name: PORT
              value: "4000"
            - name: URL_HOST
              value: {{ required "backend.host is required" .Values.backend.host | quote }}
            - name: URL_SCHEME
              value: {{ $scheme | quote }}
            {{- if .Values.url.port }}
            - name: URL_PORT
              value: {{ .Values.url.port | quote }}
            {{- end }}
            - name: DATABASE_HOSTNAME
              value: {{ required "backend.database.hostname is required" .Values.backend.database.hostname | quote }}
            - name: DATABASE_USERNAME
              value: {{ .Values.backend.database.username | quote }}
            - name: DATABASE_NAME
              value: {{ .Values.backend.database.database | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "backend.database.passwordExistingSecret is required" .Values.backend.database.passwordExistingSecret }}
                  key: {{ .Values.backend.database.passwordExistingSecretKey }}
            {{- if .Values.backend.database.poolSize }}
            - name: POOL_SIZE
              value: {{ .Values.backend.database.poolSize | quote }}
            {{- end }}
            - name: SECRET_KEY_BASE
              {{- if .Values.backend.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret }}
                  key: {{ .Values.backend.existingSecretKey }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}
                  key: {{ .Values.backend.existingSecretKey }}
              {{- end }}
            {{- if .Values.backend.storage.maxUploadSizeBytes }}
            - name: MAX_UPLOAD_SIZE_BYTES
              value: {{ .Values.backend.storage.maxUploadSizeBytes | quote }}
            {{- end }}
            - name: ADMIN_JWT_PUBLIC_KEY_PATH
              value: /keys/admin_public.pem
            {{- if .Values.forwarder.enabled }}
            - name: EDGEHOG_FORWARDER_HOSTNAME
              value: {{ required "forwarder.host is required when forwarder.enabled is true" .Values.forwarder.host | quote }}
            - name: EDGEHOG_FORWARDER_PORT
              value: {{ include "edgehog.forwarderExternalPort" . | quote }}
            - name: EDGEHOG_FORWARDER_SECURE_SESSIONS
              value: {{ ternary "true" "false" (eq $scheme "https") | quote }}
            {{- end }}
            {{- if .Values.backend.gqlSubscriptionsAllowedOrigins }}
            - name: GQL_SUBSCRIPTIONS_ALLOWED_ORIGINS
              value: {{ .Values.backend.gqlSubscriptionsAllowedOrigins | quote }}
            {{- else if .Values.frontend.enabled }}
            - name: GQL_SUBSCRIPTIONS_ALLOWED_ORIGINS
              value: {{ printf "%s://%s%s" $scheme .Values.frontend.host $portSuffix | quote }}
            {{- end }}
            {{- if eq .Values.backend.storage.type "azure" }}
            - name: STORAGE_TYPE
              value: azure
            - name: AZURE_CONTAINER
              value: {{ required "backend.storage.azure.container is required" .Values.backend.storage.azure.container | quote }}
            {{- if .Values.backend.storage.azure.existingSecret }}
            - name: AZURE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.storage.azure.existingSecret }}
                  key: {{ .Values.backend.storage.azure.existingSecretConnectionStringKey }}
            {{- else if .Values.backend.storage.azure.connectionString }}
            - name: AZURE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-azure
                  key: connection-string
            {{- else }}
            - name: AZURE_STORAGE_ACCOUNT_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-azure
                  key: account-name
            - name: AZURE_STORAGE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-azure
                  key: account-key
            {{- if .Values.backend.storage.azure.blobEndpoint }}
            - name: AZURE_BLOB_ENDPOINT
              value: {{ .Values.backend.storage.azure.blobEndpoint | quote }}
            {{- end }}
            {{- if .Values.backend.storage.azure.region }}
            - name: AZURE_REGION
              value: {{ .Values.backend.storage.azure.region | quote }}
            {{- end }}
            {{- end }}
            {{- else }}
            {{- $s3 := .Values.backend.storage.s3 }}
            - name: S3_SCHEME
              value: {{ $s3.scheme | quote }}
            - name: S3_HOST
              value: {{ required "backend.storage.s3.host is required" $s3.host | quote }}
            {{- if $s3.port }}
            - name: S3_PORT
              value: {{ $s3.port | quote }}
            {{- end }}
            - name: S3_BUCKET
              value: {{ required "backend.storage.s3.bucket is required" $s3.bucket | quote }}
            {{- if $s3.region }}
            - name: S3_REGION
              value: {{ $s3.region | quote }}
            {{- end }}
            {{- if $s3.assetHost }}
            - name: S3_ASSET_HOST
              value: {{ $s3.assetHost | quote }}
            {{- end }}
            {{- if $s3.gcpCredentialsExistingSecret }}
            - name: S3_GCP_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: {{ $s3.gcpCredentialsExistingSecret }}
                  key: {{ $s3.gcpCredentialsExistingSecretKey }}
            {{- else if $s3.existingSecret }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $s3.existingSecret }}
                  key: {{ $s3.existingSecretAccessKeyIdKey }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $s3.existingSecret }}
                  key: {{ $s3.existingSecretSecretAccessKeyKey }}
            {{- else }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-s3
                  key: access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-s3
                  key: secret-access-key
            {{- end }}
            {{- end }}
            {{- $geo := .Values.backend.geolocation }}
            {{- if and (not $geo.existingSecret) $geo.ipbaseApiKey }}
            - name: IPBASE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-geo
                  key: ipbase-api-key
            {{- end }}
            {{- if and (not $geo.existingSecret) $geo.googleGeolocationApiKey }}
            - name: GOOGLE_GEOLOCATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-geo
                  key: google-geolocation-api-key
            {{- end }}
            {{- if and (not $geo.existingSecret) $geo.googleGeocodingApiKey }}
            - name: GOOGLE_GEOCODING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $fullname }}-geo
                  key: google-geocoding-api-key
            {{- end }}
            {{- if $geo.existingSecret }}
            - name: IPBASE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $geo.existingSecret }}
                  key: ipbase-api-key
                  optional: true
            - name: GOOGLE_GEOLOCATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $geo.existingSecret }}
                  key: google-geolocation-api-key
                  optional: true
            - name: GOOGLE_GEOCODING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $geo.existingSecret }}
                  key: google-geocoding-api-key
                  optional: true
            {{- end }}
            {{- if $geo.preferredGeolocationProviders }}
            - name: PREFERRED_GEOLOCATION_PROVIDERS
              value: {{ $geo.preferredGeolocationProviders | quote }}
            {{- end }}
            {{- if $geo.preferredGeocodingProviders }}
            - name: PREFERRED_GEOCODING_PROVIDERS
              value: {{ $geo.preferredGeocodingProviders | quote }}
            {{- end }}
            {{- with .Values.backend }}
            {{- if .tenantReconcilerTimeoutMs }}
            - name: EDGEHOG_TENANT_RECONCILER_TIMEOUT
              value: {{ .tenantReconcilerTimeoutMs | quote }}
            {{- end }}
            {{- if .messageMinTimeoutMs }}
            - name: EDGEHOG_MESSAGE_MIN_TIMEOUT
              value: {{ .messageMinTimeoutMs | quote }}
            {{- end }}
            {{- if .messageMaxTimeoutMs }}
            - name: EDGEHOG_MESSAGE_MAX_TIMEOUT
              value: {{ .messageMaxTimeoutMs | quote }}
            {{- end }}
            {{- if .provisioningMaxRetries }}
            - name: EDGEHOG_PROVISIONING_MAX_RETRIES
              value: {{ .provisioningMaxRetries | quote }}
            {{- end }}
            {{- if .deploymentProvisioningTimeoutMs }}
            - name: EDGEHOG_DEPLOYMENT_PROVISIONING_TIMEOUT
              value: {{ .deploymentProvisioningTimeoutMs | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.backend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.backend.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          volumeMounts:
            - name: admin-public-key
              mountPath: /keys
              readOnly: true
      volumes:
        - name: admin-public-key
          secret:
            secretName: {{ default (printf "%s-admin-key" $fullname) .Values.backend.adminApi.existingSecret }}
            items:
              - key: {{ default "admin_public.pem" .Values.backend.adminApi.existingSecretKey }}
                path: admin_public.pem
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
